<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>Manager PDF - Gestion et Modification de PDF</title>
    <meta name="description" content="Manager PDF est une suite professionnelle pour modifier, fusionner, sécuriser et générer des documents PDF (Contrats, Factures, CV). Application web sécurisée et rapide." />
    <meta name="keywords" content="PDF, modifier PDF, sécuriser PDF, fusionner PDF, outil PDF, formulaires, contrats, factures" />
    <meta name="author" content="Manager PDF" />

    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Manager PDF - Gestion de PDF" />
    <meta property="og:description" content="Modifiez, fusionnez et sécurisez vos PDF facilement dans votre navigateur." />
    <meta property="og:type" content="website" />
    
    <!-- PDF.js CDN for rendering PDF pages -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
    <script>
      if (window.pdfjsLib) {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc =
          'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
      }
    </script>
  </head>
  <body>
    <!-- Contenu visible par les crawlers/bots si JS est désactivé -->
    <noscript>
      <h1>Manager PDF - Outils de gestion de PDF</h1>
      <p>Bienvenue sur Manager PDF. Pour utiliser notre application de modification, fusion et protection de PDF, veuillez activer JavaScript dans votre navigateur.</p>
    </noscript>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
